name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Require Chrome for rendering tests
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: node --check knowledge_video/static/app.js
      - run: node --check narration_video/render_deck.mjs
      - run: python scripts/audit_release.py --history
      - run: python -m build
      - run: python scripts/package_source.py
