name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk gitleaks
      - name: Require Chrome for rendering tests
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - run: pip install -e '.[dev]'
      - name: Pre-commit gate
        run: pre-commit run --all-files
      - run: pytest -q --cov=knowledge_video --cov=narration_video --cov-fail-under=60
      - run: node --check knowledge_video/static/app.js
      - run: node --check narration_video/render_deck.mjs
      - run: python scripts/audit_release.py --history
      - run: python -m build
      - run: python scripts/package_source.py
